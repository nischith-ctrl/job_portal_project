{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold text-center mb-3">Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
            <hr>
            <div class="small text-muted">
                <strong>Demo Accounts (Pre-seeded):</strong><br>
                Admin: <code>admin@jobportal.com</code> / <code>admin123</code><br>
                Employer: <code>hr@techcorp.com</code> / <code>employer123</code><br>
                Job Seeker: <code>john@example.com</code> / <code>seeker123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
